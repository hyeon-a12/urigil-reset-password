<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>비밀번호 재설정 · 우리길</title>
<style>
  @font-face {
    font-family: 'Pretendard';
    src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2') format('woff2');
    font-weight: 400;
  }
  @font-face {
    font-family: 'Pretendard';
    src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2') format('woff2');
    font-weight: 700;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #FFFFFF; /* COLORS.background */
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: #FFFFFF;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(68, 58, 49, 0.08); /* shadow: #443A31 */
    padding: 40px 32px;
    text-align: center;
  }

  .logo {
    font-size: 22px;
    font-weight: 700;
    color: #222222;
    margin-bottom: 4px;
  }
  .logo span { color: #FF7F5C; }

  .subtitle {
    font-size: 14px;
    color: #8A8A8A;
    margin-bottom: 32px;
  }

  .field {
    text-align: left;
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #222222;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #DDDDDD;
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
    color: #222222;
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus {
    border-color: #FF7F5C;
  }

  .hint {
    font-size: 12px;
    color: #8A8A8A;
    margin-top: 6px;
    text-align: left;
  }
  .hint.error {
    color: #E14D3F;
  }

  .submit-btn {
    width: 100%;
    padding: 15px;
    background: #FF7F5C;
    color: #FFFFFF;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s;
  }
  .submit-btn:hover { background: #E8613D; }
  .submit-btn:disabled {
    background: #DDDDDD;
    cursor: not-allowed;
  }

  .status-box {
    display: none;
    padding: 20px;
  }
  .status-box.show { display: block; }
  .status-icon {
    width: 56px;
    height: 56px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-size: 28px;
  }
  .status-icon.success { background: #FFF3DF; }
  .status-icon.error { background: #FDEBE9; }
  .status-title {
    font-size: 17px;
    font-weight: 700;
    color: #222222;
    margin-bottom: 8px;
  }
  .status-desc {
    font-size: 14px;
    color: #8A8A8A;
    line-height: 1.5;
  }

  .form-view.hidden { display: none; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">우리<span>길</span></div>
  <div class="subtitle">새로운 비밀번호를 설정해주세요</div>

  <div class="form-view" id="formView">
    <form id="resetForm">
      <div class="field">
        <label for="newPassword">새 비밀번호</label>
        <input type="password" id="newPassword" placeholder="8자 이상 입력해주세요" required minlength="8" />
      </div>
      <div class="field">
        <label for="confirmPassword">비밀번호 확인</label>
        <input type="password" id="confirmPassword" placeholder="비밀번호를 다시 입력해주세요" required minlength="8" />
        <div class="hint error" id="matchHint" style="display:none;">비밀번호가 일치하지 않습니다</div>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">비밀번호 변경하기</button>
    </form>
  </div>

  <div class="status-box" id="statusBox">
    <div class="status-icon" id="statusIcon"></div>
    <div class="status-title" id="statusTitle"></div>
    <div class="status-desc" id="statusDesc"></div>
  </div>
</div>

<script>
  // ── 설정: 백엔드 API 주소만 실제 Railway 배포 주소로 바꿔주세요 ──
  const API_BASE_URL = 'https://your-railway-app.up.railway.app';

  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  const formView = document.getElementById('formView');
  const statusBox = document.getElementById('statusBox');
  const statusIcon = document.getElementById('statusIcon');
  const statusTitle = document.getElementById('statusTitle');
  const statusDesc = document.getElementById('statusDesc');
  const matchHint = document.getElementById('matchHint');
  const submitBtn = document.getElementById('submitBtn');

  function showStatus(type, title, desc) {
    formView.classList.add('hidden');
    statusBox.classList.add('show');
    statusIcon.className = 'status-icon ' + type;
    statusIcon.textContent = type === 'success' ? '✓' : '✕';
    statusTitle.textContent = title;
    statusDesc.textContent = desc;
  }

  // 토큰 없이 접속한 경우
  if (!token) {
    showStatus(
      'error',
      '유효하지 않은 링크입니다',
      '이메일에 있는 링크를 다시 확인해주세요.\n링크가 만료되었을 수도 있습니다.'
    );
  }

  document.getElementById('resetForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (newPassword !== confirmPassword) {
      matchHint.style.display = 'block';
      return;
    }
    matchHint.style.display = 'none';

    submitBtn.disabled = true;
    submitBtn.textContent = '변경하는 중...';

    try {
      const res = await fetch(`${API_BASE_URL}/auth/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword }),
      });

      const data = await res.json();

      if (res.ok) {
        showStatus(
          'success',
          '비밀번호가 변경되었습니다',
          '이제 앱에서 새 비밀번호로 로그인해주세요.'
        );
      } else {
        showStatus(
          'error',
          '변경에 실패했습니다',
          data.error || '링크가 만료되었거나 이미 사용된 링크입니다.\n비밀번호 찾기를 다시 시도해주세요.'
        );
      }
    } catch (err) {
      showStatus(
        'error',
        '오류가 발생했습니다',
        '잠시 후 다시 시도해주세요.'
      );
    }
  });
</script>

</body>
</html>
